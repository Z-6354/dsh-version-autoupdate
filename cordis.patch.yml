# dsh-version-autoupdate bundle patch.
#
# Loads the host half (version status + one-click auto-update API). Tune the
# runtime behaviour from the profile/home patch if needed:
#   - packageManager: 'npm' | 'pnpm' | 'yarn' | 'auto' (default npm; resolves beside running dsh Node)
#   - packageManagerPath: absolute path override (e.g. /home/ubuntu/.local/node-v22.19.0/bin/npm)
#   - minAvailableMemoryMb: refuse update when Linux MemAvailable is below this (default 400, 0=off)
#   - installTimeoutMs: global install max wait (default 600000 = 10 min; slow VPS use 900000+)
#   - installGraceMs: SIGTERM grace before force-kill (default 60000)
#   - installTimeoutMs: global install subprocess timeout (default 600000 = 10 min)
#   - installGraceMs: SIGTERM grace before force-kill (default 60000)
#   - channel: 'preview' (default; highest version incl. pre-releases) | 'stable'
#   - force: boolean (bypass registry cache on /status)
- insert:
    - id: dsh-version-autoupdate
      name: dsh-version-autoupdate
      config:
        packageManager: npm
        # packageManagerPath: /home/ubuntu/.local/node-v22.19.0/bin/npm
        minAvailableMemoryMb: 400
        installTimeoutMs: 1200000
        installIdleTimeoutMs: 0
        installGraceMs: 60000
        autoRestart: false
        updatePolicy: platform
        offlineInstall: never
        offlineInstallMaxMemMb: 2560
        systemdUnit: dsh-web.service
        restartDelayMs: 2000
        force: false
        channel: preview
        # reverse-proxied public origins allowed to trigger updates
        trustedOrigins: [dsh.wannian.fun, wannian.fun, www.wannian.fun]
